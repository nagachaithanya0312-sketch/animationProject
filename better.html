<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moon & Earth Interactive Universe - Fast Voice Edition</title>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100vw; height: 100vh; overflow: hidden; 
            background-color: #000; font-family: "Segoe UI", sans-serif; user-select: none;
        }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #ui-overlay {
            position: absolute; top: 20px; left: 20px; color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem; z-index: 10; pointer-events: none; letter-spacing: 1px;
            text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.9); line-height: 1.5;
        }

        #voice-cmd-display {
            margin-top: 15px; color: #4CAF50; font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9); font-size: 1rem;
        }

        #mode-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 5rem; font-weight: 800; letter-spacing: 15px;
            text-transform: uppercase; z-index: 10; pointer-events: none; opacity: 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        /* CAMERA CONTROLS UI */
        #camera-controls {
            position: absolute; top: 20px; right: 20px; z-index: 30;
            display: none; 
            flex-direction: column; gap: 10px;
            background: rgba(15, 20, 25, 0.85); padding: 15px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 220px;
        }
        #camera-controls label { font-size: 0.7rem; color: #ccc; text-transform: uppercase; letter-spacing: 1px; }
        #camera-select {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 8px; border-radius: 4px; font-size: 0.8rem;
            outline: none; cursor: pointer; width: 100%; text-overflow: ellipsis;
        }
        #camera-select option { background: #111; color: #fff; }
        #switch-cam-btn {
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 8px; border-radius: 4px; font-size: 0.8rem;
            font-weight: bold; cursor: pointer; transition: background 0.2s; text-transform: uppercase;
        }
        #switch-cam-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* Start Screen */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 50; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        
        #start-btn {
            background: linear-gradient(45deg, #2196F3, #4CAF50);
            color: white; border: none; padding: 15px 40px; font-size: 1.2rem;
            font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.5); text-transform: uppercase;
            letter-spacing: 2px; transition: transform 0.2s; margin-bottom: 20px;
        }
        
        #start-btn:hover { transform: scale(1.05); }
        
        #error-msg {
            color: #ff4444; font-weight: bold; max-width: 650px; 
            font-size: 1rem; padding: 15px; border: 1px solid #ff4444; 
            border-radius: 8px; background: rgba(255,0,0,0.1); display: none;
            line-height: 1.5;
        }

        .loader { color: white; font-size: 1rem; letter-spacing: 2px; display: none; margin-bottom: 20px; }

        #video-feed { 
            position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; 
            border-radius: 10px; border: 2px solid rgba(255,255,255,0.2); 
            z-index: 20; object-fit: cover; transform: scaleX(-1); 
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            #camera-controls { top: auto; bottom: 160px; right: 20px; width: calc(100% - 40px); }
            #ui-overlay { font-size: 0.75rem; }
            #mode-text { font-size: 3rem; }
        }
    </style>
</head>
<body>

<!-- Audio Element -->
<audio id="bg-audio" loop>
    <source src="space.mp3" type="audio/mpeg">
</audio>

<div id="start-screen">
    <button id="start-btn">Allow Camera, Mic & Start</button>
    <div id="loader" class="loader">Requesting Access (Laptop/Mobile)...</div>
    <div id="error-msg"></div>
</div>

<div id="ui-overlay">
    <div id="instructions">Waiting for Camera...</div>
    <div id="voice-cmd-display">🎤 Voice Assistant: Waiting...</div>
</div>
<div id="mode-text">MOON</div>

<!-- CAMERA CONTROLS -->
<div id="camera-controls">
    <label for="camera-select">Select Camera</label>
    <select id="camera-select">
        <option value="">Loading cameras...</option>
    </select>
    <button id="switch-cam-btn">Switch Camera</button>
</div>

<video id="video-feed" autoplay playsinline muted></video>
<div id="canvas-container"></div>

<script>
    // =========================================================
    // 1. THREE.JS SCENE SETUP
    // =========================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin("anonymous");

    // Lighting
    const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
    sunLight.position.set(50, 20, 30);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x404040, 0.6));

    const globeContainer = new THREE.Group();
    scene.add(globeContainer);

    // =========================================================
    // 2. DYNAMIC BACKGROUNDS (SPACE VS EARTH NATURE)
    // =========================================================
    function createStars() {
        const starCount = 3000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        const starPhase = new Float32Array(starCount);
        
        for(let i=0; i<starCount; i++) {
            const r = 150 + Math.random() * 400;
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);
            starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            starPos[i*3+2] = r * Math.cos(phi);
            starPhase[i] = Math.random() * Math.PI * 2;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));

        const starMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uOpacity: { value: 1.0 } },
            vertexShader: `
                uniform float uTime; attribute float aPhase; varying float vAlpha;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize = (150.0 / -mvPosition.z);
                    vAlpha = 0.2 + 0.8 * abs(sin(uTime * 1.0 + aPhase));
                }
            `,
            fragmentShader: `
                varying float vAlpha; uniform float uOpacity;
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if(dist > 0.5) discard;
                    gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha * uOpacity * (1.0 - dist*2.0));
                }
            `,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });
        return new THREE.Points(starGeo, starMat);
    }
    const starField = createStars();
    scene.add(starField);

    const natureGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
    const natureMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uOpacity: { value: 0.0 } },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime; uniform float uOpacity;
            varying vec2 vUv;
            
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
            float snoise(vec2 v) {
                const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy)); vec2 x0 = v - i + dot(i, C.xx);
                vec2 i1; i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
                i = mod289(i);
                vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                m = m*m; m = m*m;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5; vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox; m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
                vec3 g; g.x = a0.x * x0.x + h.x * x0.y; g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }
            float fbm(vec2 p) {
                float f = 0.0; float w = 0.5;
                for (int i = 0; i < 5; i++) {
                    f += w * snoise(p); p *= 2.0; w *= 0.5;
                }
                return f;
            }

            void main() {
                vec2 uv = vUv * 3.0;
                float noise = fbm(uv + uTime * 0.1);
                float noise2 = fbm(uv * 2.0 - uTime * 0.15);
                
                vec3 darkGreen = vec3(0.02, 0.2, 0.1);
                vec3 waterBlue = vec3(0.0, 0.4, 0.5);
                vec3 brightGreen = vec3(0.2, 0.6, 0.2);
                
                vec3 color = mix(darkGreen, waterBlue, noise + 0.5);
                color = mix(color, brightGreen, noise2);
                
                gl_FragColor = vec4(color, uOpacity);
            }
        `,
        transparent: true, depthWrite: false
    });
    const natureBackground = new THREE.Mesh(natureGeo, natureMat);
    natureBackground.position.z = -50; 
    scene.add(natureBackground);

    // =========================================================
    // 3. PLANETS (MOON & EARTH ONLY)
    // =========================================================
    const baseSphereGeo = new THREE.SphereGeometry(6, 64, 64);
    
    const moonGroup = new THREE.Group(); 
    const moonMat = new THREE.MeshStandardMaterial({
        map: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/moon_1024.jpg'),
        transparent: true, opacity: 1.0, depthWrite: true
    });
    moonGroup.add(new THREE.Mesh(baseSphereGeo, moonMat));
    globeContainer.add(moonGroup);

    const earthGroup = new THREE.Group(); 
    earthGroup.visible = false;
    const earthMat = new THREE.MeshPhongMaterial({
        map: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg'),
        transparent: true, opacity: 0.0, depthWrite: true
    });
    earthGroup.add(new THREE.Mesh(baseSphereGeo, earthMat));
    globeContainer.add(earthGroup);

    const glowMat = new THREE.ShaderMaterial({
        uniforms: { uOpacity: { value: 1.0 }, uColor: { value: new THREE.Color(0xaaccff) } },
        vertexShader: `
            varying vec3 vNormal; varying vec3 vViewVec;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                vViewVec = -normalize(mvPos.xyz);
                gl_Position = projectionMatrix * mvPos;
            }
        `,
        fragmentShader: `
            uniform float uOpacity; uniform vec3 uColor;
            varying vec3 vNormal; varying vec3 vViewVec;
            void main() {
                float intensity = pow(0.6 - dot(vNormal, vViewVec), 2.5);
                gl_FragColor = vec4(uColor, intensity * uOpacity * 1.5);
            }
        `,
        blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
    });
    const planetGlow = new THREE.Mesh(new THREE.SphereGeometry(6.6, 64, 64), glowMat);
    globeContainer.add(planetGlow);

    // =========================================================
    // 4. STATE & INTERACTION LOGIC
    // =========================================================
    const clock = new THREE.Clock();
    let targetRotX = 0, targetRotY = 0, currentRotX = 0, currentRotY = 0;
    let targetScale = 1.0, currentScale = 1.0;
    
    let targetMode = 0; 
    let modeWeights = { moon: 1.0, earth: 0.0 };
    let lastModeChangeTime = 0;
    
    let targetBrightness = 1.0; 
    let customBrightness = 1.0; 
    
    // Voice rotation variables
    let voiceAutoRotate = false;
    let rotationSpeed = 0.02; // Default speed
    let isHandRotating = false; 
    
    const uiInstructions = document.getElementById('instructions');
    const voiceCmdDisplay = document.getElementById('voice-cmd-display');
    const modeText = document.getElementById('mode-text');

    function triggerModeText(text) {
        modeText.innerText = text;
        modeText.style.opacity = 1;
        modeText.style.transform = "translate(-50%, -50%) scale(1.2)";
        setTimeout(() => { 
            modeText.style.opacity = 0; 
            modeText.style.transform = "translate(-50%, -50%) scale(1.0)"; 
        }, 1200);
    }

    // Hand Gesture Processing
    function onHandResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            uiInstructions.innerHTML = "Hands Active - Left: Rotate/Swipe | Right: Brightness (Y Axis) | Both: Zoom";
            
            let leftHand = null, rightHand = null;

            if (results.multiHandLandmarks.length === 1) {
                if (results.multiHandLandmarks[0][0].x > 0.5) leftHand = results.multiHandLandmarks[0];
                else rightHand = results.multiHandLandmarks[0];
            } else {
                const h1 = results.multiHandLandmarks[0], h2 = results.multiHandLandmarks[1];
                if (h1[0].x > h2[0].x) { leftHand = h1; rightHand = h2; }
                else { leftHand = h2; rightHand = h1; }
            }

            if (leftHand) {
                isHandRotating = true;
                targetRotY = -(leftHand[0].x - 0.5) * Math.PI * 3;
                targetRotX = (leftHand[0].y - 0.5) * Math.PI * 2;

                if (leftHand[0].x > 0.8) {
                    if (Date.now() - lastModeChangeTime > 1500) { 
                        targetMode = (targetMode === 0) ? 1 : 0; 
                        triggerModeText(["MOON", "EARTH"][targetMode]);
                        lastModeChangeTime = Date.now();
                    }
                }
            } else {
                isHandRotating = false; 
            }

            if (rightHand) {
                targetBrightness = 1.0 - (rightHand[0].y * 0.85); 
            }

            if (leftHand && rightHand) {
                const dist = Math.hypot(leftHand[0].x - rightHand[0].x, leftHand[0].y - rightHand[0].y);
                targetScale = Math.max(0.5, Math.min(dist * 3.0, 2.5));
            }
        } else {
            uiInstructions.innerHTML = "Show hands or use voice commands (Fast/Slow/Rotate).";
            targetScale = 1.0; 
            isHandRotating = false;
        }
    }

    // =========================================================
    // 5. FAST VOICE ASSISTANT LOGIC (INTERIM RESULTS ENABLED)
    // =========================================================
    function initVoiceAssistant() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            // ENABLED INTERIM RESULTS FOR INSTANT RESPONSE
            recognition.interimResults = true; 
            recognition.lang = 'en-US';

            let lastCommandTime = 0;

            recognition.onresult = (event) => {
                let latestWords = "";
                // Loop to get the most recent words being spoken right now
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    latestWords += event.results[i][0].transcript.toLowerCase();
                }
                
                if (latestWords.trim().length > 0) {
                    voiceCmdDisplay.innerText = '🎤 Hearing: "' + latestWords.trim() + '"';
                }
                
                const now = Date.now();
                // Prevent duplicate triggering of the same command instantly
                if (now - lastCommandTime < 600) return; 

                let commandExecuted = false;

                // Planet Switching
                if (latestWords.includes('moon')) { 
                    targetMode = 0; triggerModeText("MOON"); commandExecuted = true; 
                } 
                else if (latestWords.includes('earth')) { 
                    targetMode = 1; triggerModeText("EARTH"); commandExecuted = true; 
                }

                // Brightness Controls
                if (latestWords.includes('up') || latestWords.includes('increase')) { 
                    targetBrightness = Math.min(1.0, targetBrightness + 0.3); commandExecuted = true; 
                } 
                else if (latestWords.includes('down') || latestWords.includes('decrease')) { 
                    targetBrightness = Math.max(0.1, targetBrightness - 0.3); commandExecuted = true; 
                }

                // Rotation & Speed Controls
                if (latestWords.includes('fast')) { 
                    rotationSpeed = 0.08; voiceAutoRotate = true; commandExecuted = true; 
                }
                else if (latestWords.includes('slow')) { 
                    rotationSpeed = 0.005; voiceAutoRotate = true; commandExecuted = true; 
                }
                else if (latestWords.includes('rotate') || latestWords.includes('spin')) { 
                    // Snaps to perfect upright globe position and starts rotating
                    targetRotX = 0; 
                    voiceAutoRotate = true; 
                    commandExecuted = true; 
                } 
                else if (latestWords.includes('stop')) { 
                    voiceAutoRotate = false; commandExecuted = true; 
                }

                if (commandExecuted) {
                    lastCommandTime = now;
                    voiceCmdDisplay.innerText = '✅ Executed: "' + latestWords.trim() + '"';
                }
            };

            recognition.onerror = (e) => console.log("Voice Error: ", e.error);
            
            // Auto-restart if it naturally stops listening
            recognition.onend = () => {
                recognition.start();
            };

            recognition.start();
            voiceCmdDisplay.innerText = "🎤 Voice Assistant: Listening (Say 'Moon', 'Earth', 'Rotate', 'Fast', 'Slow')";
        } else {
            voiceCmdDisplay.innerText = "🎤 Voice Assistant: Not Supported in this browser.";
            voiceCmdDisplay.style.color = "red";
        }
    }

    // =========================================================
    // 6. CAMERA & START LOGIC
    // =========================================================
    const videoElement = document.getElementById('video-feed');
    const startBtn = document.getElementById('start-btn');
    const loader = document.getElementById('loader');
    const startScreen = document.getElementById('start-screen');
    const errorMsg = document.getElementById('error-msg');
    const bgAudio = document.getElementById('bg-audio');
    
    const cameraControls = document.getElementById('camera-controls');
    const cameraSelect = document.getElementById('camera-select');
    const switchCamBtn = document.getElementById('switch-cam-btn');

    let currentStream = null;
    let mediapipeHandsInit = false; 
    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    hands.onResults(onHandResults);

    function stopCurrentCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
        videoElement.srcObject = null;
    }

    async function populateCameraList() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');
            cameraSelect.innerHTML = '';
            if (videoDevices.length === 0) return (cameraSelect.innerHTML = '<option value="">No camera found</option>');

            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Camera ${index + 1}`;
                cameraSelect.appendChild(option);
            });
            
            if (currentStream && currentStream.getVideoTracks().length > 0) {
                const activeSettings = currentStream.getVideoTracks()[0].getSettings();
                if (activeSettings.deviceId) cameraSelect.value = activeSettings.deviceId;
            }
        } catch (err) {}
    }

    async function startCamera(deviceId = null) {
        stopCurrentCamera();
        const constraints = { video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false };
        if (deviceId) constraints.video.deviceId = { exact: deviceId };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = currentStream;
            await new Promise((resolve) => { videoElement.onloadedmetadata = () => resolve(); });
            await populateCameraList();
            return true;
        } catch (err) {
            handleCameraError(err);
            return false;
        }
    }

    function handleCameraError(err) {
        loader.style.display = 'none';
        errorMsg.style.display = 'block';
        startBtn.style.display = 'inline-block';
        startBtn.innerText = "Try Again";
        errorMsg.innerHTML = `❌ <b>Camera Error</b> ❌<br><br>${err.message || err.name}`;
    }

    startBtn.addEventListener('click', async () => {
        startBtn.style.display = 'none';
        errorMsg.style.display = 'none';
        loader.style.display = 'block';

        bgAudio.play().catch(e => console.log('Audio autoplay prevented:', e));

        const success = await startCamera();
        
        if (success) {
            startScreen.style.display = 'none';
            cameraControls.style.display = 'flex'; 

            initVoiceAssistant();

            if (!mediapipeHandsInit) {
                mediapipeHandsInit = true;
                const sendFrames = async () => {
                    if (!videoElement.paused && !videoElement.ended && currentStream) {
                        await hands.send({ image: videoElement });
                    }
                    requestAnimationFrame(sendFrames);
                };
                sendFrames();
            }
        }
    });

    cameraSelect.addEventListener('change', async (e) => {
        if (e.target.value) await startCamera(e.target.value);
    });

    switchCamBtn.addEventListener('click', async () => {
        const options = Array.from(cameraSelect.options);
        if (options.length <= 1) return; 
        const currentIndex = options.findIndex(opt => opt.selected);
        const nextIndex = (currentIndex + 1) % options.length;
        if (options[nextIndex].value) {
            cameraSelect.value = options[nextIndex].value;
            await startCamera(options[nextIndex].value);
        }
    });

    // =========================================================
    // 7. RENDER LOOP
    // =========================================================
    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        // Voice Rotation override (only applies if Hand is not actively rotating)
        // This spins the globe 360 degrees constantly on the Y axis
        if (voiceAutoRotate && !isHandRotating) {
            targetRotY += rotationSpeed; 
        }

        currentRotX += (targetRotX - currentRotX) * 0.1;
        currentRotY += (targetRotY - currentRotY) * 0.1;
        currentScale += (targetScale - currentScale) * 0.1;
        
        // Smoothly approach the target brightness (set by either Hand or Voice)
        customBrightness += (targetBrightness - customBrightness) * 0.1;
        
        globeContainer.rotation.x = currentRotX;
        globeContainer.rotation.y = currentRotY + (time * 0.05); 
        globeContainer.scale.set(currentScale, currentScale, currentScale);

        starField.rotation.y = time * 0.01;
        starField.material.uniforms.uTime.value = time;
        natureMat.uniforms.uTime.value = time;

        modeWeights.moon += ((targetMode === 0 ? 1 : 0) - modeWeights.moon) * 0.05;
        modeWeights.earth += ((targetMode === 1 ? 1 : 0) - modeWeights.earth) * 0.05;

        moonGroup.visible = modeWeights.moon > 0.01;
        earthGroup.visible = modeWeights.earth > 0.01;
        moonMat.opacity = modeWeights.moon;
        earthMat.opacity = modeWeights.earth;

        starField.material.uniforms.uOpacity.value = modeWeights.moon;
        natureMat.uniforms.uOpacity.value = modeWeights.earth;

        const grayTint = new THREE.Color(customBrightness, customBrightness, customBrightness);
        moonMat.color.copy(grayTint);
        earthMat.color.copy(grayTint);

        if (targetMode === 0) glowMat.uniforms.uColor.value.copy(new THREE.Color(0xaaccff).multiply(grayTint)); 
        if (targetMode === 1) glowMat.uniforms.uColor.value.copy(new THREE.Color(0x4488ff).multiply(grayTint)); 

        renderer.render(scene, camera);
    }
    
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
