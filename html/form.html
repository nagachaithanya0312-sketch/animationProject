<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiny Registration Form</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg,#f5f501,#052ec3);
    }

    /* Main container for form + image */
    /* Remove side layout */
    .container{
        display:block;
    }

    .form-box{
        width:350px;
        padding:30px;
        border-radius:20px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(15px);
        box-shadow:0 0 30px rgba(0,0,0,0.3);
        position:relative;
        overflow:hidden;
    }

    /* Shine effect */
    .form-box::before{
        content:"";
        position:absolute;
        top:-100%;
        left:-100%;
        width:200%;
        height:200%;
        background: linear-gradient(120deg,transparent,rgba(255,255,255,0.5),transparent);
        transform: rotate(25deg);
        animation: shine 4s infinite;
    }

    @keyframes shine{
        0%{transform:translateX(-100%) rotate(25deg);} 
        100%{transform:translateX(100%) rotate(25deg);} 
    }

    h2{
        text-align:center;
        color:#fff;
        margin-bottom:20px;
    }

    .input-box{
        margin-bottom:15px;
    }

    .input-box input, .input-box select{
        width:100%;
        padding:10px;
        border:none;
        outline:none;
        border-radius:10px;
    }

    .input-box input:focus{
        box-shadow:0 0 10px #00eaff;
    }

    button{
        width:100%;
        padding:10px;
        border:none;
        border-radius:10px;
        background:#00eaff;
        color:#000;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#00bcd4;
        transform:scale(1.05);
    }

    /* Image styling (top-right inside form) */
    .profile-img{
        position:absolute;
        top:15px;
        right:15px;
        width:60px;
        height:60px;
        border-radius:50%;
        object-fit:cover;
        border:2px solid #fff;
        box-shadow:0 0 10px rgba(0,0,0,0.5);
    }
</style>
</head>

<body>

<div class="container">

    <div class="form-box">
        <!-- Top right image -->
        <img src="nani.jpg" class="profile-img" alt="nani">

        <h2>Register</h2>

        <form>
            <div class="input-box">
                <input type="text" placeholder="Enter Name" required>
            </div>

            <div class="input-box">
                <input type="email" placeholder="Enter Email" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Enter Password" required>
            </div>

            <div class="input-box">
                <select>
                    <option>Select Course</option>
                    <option>B.Tech</option>
                    <option>B.Sc</option>
                    <option>B.Com</option>
                </select>
            </div>

            <button type="submit">Register</button>
        </form>
    </div>

</div>

</body>
</html>
