    <script>

        /* =====================================================
           CANVAS
        ===================================================== */

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d", {
                alpha: true
            });


        const offCanvas =
            document.createElement("canvas");

        const offCtx =
            offCanvas.getContext("2d", {
                willReadFrequently: true
            });


        /* =====================================================
           GLOBAL SETTINGS
        ===================================================== */

        let width = 0;
        let height = 0;

        let particles = [];

        let customColor =
            "#ff4d4d";


        /*
            IMPORTANT PERFORMANCE SETTINGS

            Text uses a smaller gap.

            Images automatically use a larger gap.
        */

        const TEXT_GAP = 3;

        const IMAGE_GAP = 6;


        /*
            Maximum image particles.

            This prevents huge photos from creating
            100,000+ particles.
        */

        const MAX_IMAGE_PARTICLES = 22000;


        /*
            Maximum text particles.

            Names and emojis stay detailed.
        */

        const MAX_TEXT_PARTICLES = 18000;


        /*
            Particle size.
        */

        const particleSize = 3;


        /*
            Mouse interaction radius.
        */

        const MOUSE_RADIUS = 110;


        let mouse = {

            x: -1000,

            y: -1000

        };


        let currentMode =
            "text";


        let currentText =
            "❤️";


        let currentImgObj =
            null;


        /* =====================================================
           DOM
        ===================================================== */

        const textInput =
            document.getElementById(
                "textInput"
            );


        const colorInput =
            document.getElementById(
                "colorInput"
            );


        const imageInput =
            document.getElementById(
                "imageInput"
            );


        const audioInput =
            document.getElementById(
                "audioInput"
            );


        const audioPlayer =
            document.getElementById(
                "audioPlayer"
            );


        const micButton =
            document.getElementById(
                "micButton"
            );


        const repeatSelect =
            document.getElementById(
                "repeatSelect"
            );


        const stopSpeech =
            document.getElementById(
                "stopSpeech"
            );


        const status =
            document.getElementById(
                "status"
            );


        /* =====================================================
           STATUS
        ===================================================== */

        let statusTimer = null;


        function showStatus(message) {

            status.textContent =
                message;

            status.classList.add(
                "show"
            );


            clearTimeout(
                statusTimer
            );


            statusTimer =
                setTimeout(() => {

                    status.classList.remove(
                        "show"
                    );

                }, 2500);
        }


        /* =====================================================
           RESIZE
        ===================================================== */

        function initCanvas() {

            width =
                window.innerWidth;

            height =
                window.innerHeight;


            canvas.width =
                width;

            canvas.height =
                height;


            offCanvas.width =
                width;

            offCanvas.height =
                height;


            refreshCurrentState();
        }


        window.addEventListener(
            "resize",
            initCanvas
        );


        /* =====================================================
           PARTICLE
        ===================================================== */

        class Particle {

            constructor(
                x,
                y,
                color
            ) {

                /*
                    Start particles from
                    the center instead of
                    random screen positions.

                    This gives a controlled
                    image formation animation.
                */

                this.x =
                    width / 2 +
                    (Math.random() - 0.5) *
                    100;

                this.y =
                    height / 2 +
                    (Math.random() - 0.5) *
                    100;


                this.destX = x;

                this.destY = y;


                this.vx = 0;

                this.vy = 0;


                this.color =
                    color;
            }


            update() {

                /*
                    Spring
                */

                const dx =
                    this.destX -
                    this.x;

                const dy =
                    this.destY -
                    this.y;


                this.vx +=
                    dx * 0.075;

                this.vy +=
                    dy * 0.075;


                /*
                    Mouse interaction.

                    IMPORTANT:
                    We use squared distance.

                    No Math.sqrt().
                */

                const mdx =
                    mouse.x -
                    this.x;

                const mdy =
                    mouse.y -
                    this.y;


                const distanceSquared =
                    mdx * mdx +
                    mdy * mdy;


                const radiusSquared =
                    MOUSE_RADIUS *
                    MOUSE_RADIUS;


                if (
                    distanceSquared <
                    radiusSquared
                ) {

                    /*
                        Only calculate angle
                        when particle is actually
                        inside mouse radius.
                    */

                    const distance =
                        Math.sqrt(
                            distanceSquared
                        );


                    if (distance > 0.1) {

                        const force =
                            (
                                MOUSE_RADIUS -
                                distance
                            ) /
                            MOUSE_RADIUS;


                        const angle =
                            Math.atan2(
                                mdy,
                                mdx
                            );


                        this.vx -=
                            Math.cos(angle) *
                            force *
                            11;


                        this.vy -=
                            Math.sin(angle) *
                            force *
                            11;
                    }
                }


                /*
                    Friction
                */

                this.vx *=
                    0.82;

                this.vy *=
                    0.82;


                /*
                    Position
                */

                this.x +=
                    this.vx;

                this.y +=
                    this.vy;
            }


            draw() {

                ctx.fillStyle =
                    this.color;


                ctx.fillRect(
                    this.x,
                    this.y,
                    particleSize,
                    particleSize
                );
            }
        }


        /* =====================================================
           CREATE PARTICLES
        ===================================================== */

        function applyTargets(
            targets,
            maxParticles
        ) {

            /*
                If there are too many pixels,
                sample them instead of creating
                every single pixel.
            */

            let finalTargets =
                targets;


            if (
                finalTargets.length >
                maxParticles
            ) {

                const step =
                    finalTargets.length /
                    maxParticles;


                const sampled = [];


                for (
                    let i = 0;
                    i < maxParticles;
                    i++
                ) {

                    sampled.push(
                        finalTargets[
                            Math.floor(
                                i * step
                            )
                        ]
                    );
                }


                finalTargets =
                    sampled;
            }


            /*
                Add only the particles we need.
            */

            while (
                particles.length <
                finalTargets.length
            ) {

                const target =
                    finalTargets[
                        particles.length
                    ];


                particles.push(
                    new Particle(
                        target.x,
                        target.y,
                        target.color
                    )
                );
            }


            /*
                Remove extra particles.
            */

            if (
                particles.length >
                finalTargets.length
            ) {

                particles.length =
                    finalTargets.length;
            }


            /*
                DIRECT assignment.

                NO random sorting.

                This removes a large amount
                of CPU work.
            */

            for (
                let i = 0;
                i < finalTargets.length;
                i++
            ) {

                const target =
                    finalTargets[i];


                particles[i].destX =
                    target.x;

                particles[i].destY =
                    target.y;

                particles[i].color =
                    target.color;
            }
        }


        /* =====================================================
           GET PIXELS
        ===================================================== */

        function getPixels(
            gap,
            maxParticles
        ) {

            const imageData =
                offCtx.getImageData(
                    0,
                    0,
                    width,
                    height
                );


            const data =
                imageData.data;


            const targets = [];


            for (
                let y = 0;
                y < height;
                y += gap
            ) {

                for (
                    let x = 0;
                    x < width;
                    x += gap
                ) {

                    const index =
                        (
                            y * width +
                            x
                        ) * 4;


                    const alpha =
                        data[index + 3];


                    if (
                        alpha > 50
                    ) {

                        const r =
                            data[index];

                        const g =
                            data[index + 1];

                        const b =
                            data[index + 2];


                        targets.push({

                            x: x,

                            y: y,

                            color:
                                `rgba(
                                    ${r},
                                    ${g},
                                    ${b},
                                    ${alpha / 255}
                                )`
                        });
                    }
                }
            }


            applyTargets(
                targets,
                maxParticles
            );
        }


        /* =====================================================
           TEXT
        ===================================================== */

        function updateTargetsFromText(
            text
        ) {

            currentMode =
                "text";


            currentText =
                text;


            offCtx.clearRect(
                0,
                0,
                width,
                height
            );


            if (
                text === ""
            ) {

                text =
                    "❤️";
            }


            offCtx.fillStyle =
                customColor;


            offCtx.textAlign =
                "center";


            offCtx.textBaseline =
                "middle";


            const characters =
                [...text].length;


            /*
                Responsive text size.
            */

            let fontSize;


            if (
                characters <= 2
            ) {

                fontSize =
                    Math.min(
                        width,
                        height
                    ) * 0.48;
            }

            else if (
                characters <= 8
            ) {

                fontSize =
                    Math.min(
                        width,
                        height
                    ) * 0.27;
            }

            else if (
                characters <= 16
            ) {

                fontSize =
                    Math.min(
                        width,
                        height
                    ) * 0.18;
            }

            else {

                fontSize =
                    Math.min(
                        width,
                        height
                    ) * 0.11;
            }


            /*
                Prevent extremely wide text.
            */

            offCtx.font =
                `bold ${fontSize}px Arial`;


            let measured =
                offCtx.measureText(
                    text
                );


            /*
                Scale down if text is
                wider than 85% of screen.
            */

            if (
                measured.width >
                width * 0.85
            ) {

                fontSize *=
                    (
                        width * 0.85
                    ) /
                    measured.width;


                offCtx.font =
                    `bold ${fontSize}px Arial`;
            }


            offCtx.fillText(
                text,
                width / 2,
                height / 2
            );


            getPixels(
                TEXT_GAP,
                MAX_TEXT_PARTICLES
            );
        }


        /* =====================================================
           IMAGE
        ===================================================== */

        function updateTargetsFromImage(
            img
        ) {

            currentMode =
                "image";


            currentImgObj =
                img;


            offCtx.clearRect(
                0,
                0,
                width,
                height
            );


            /*
                Keep image inside screen.
            */

            const scale =
                Math.min(
                    (width * 0.88) /
                        img.width,

                    (height * 0.78) /
                        img.height
                );


            const imgW =
                img.width *
                scale;


            const imgH =
                img.height *
                scale;


            const dx =
                (
                    width -
                    imgW
                ) / 2;


            const dy =
                (
                    height -
                    imgH
                ) / 2;


            /*
                Draw image once to
                off-screen canvas.
            */

            offCtx.drawImage(
                img,
                dx,
                dy,
                imgW,
                imgH
            );


            /*
                IMPORTANT PERFORMANCE FIX.

                Instead of every 3 pixels,
                image uses gap 6.

                This dramatically reduces
                particle count.
            */

            getPixels(
                IMAGE_GAP,
                MAX_IMAGE_PARTICLES
            );


            showStatus(
                `🖼️ Image loaded smoothly`
            );
        }


        function refreshCurrentState() {

            if (
                currentMode ===
                "text"
            ) {

                updateTargetsFromText(
                    currentText
                );
            }


            else if (
                currentMode ===
                "image" &&
                currentImgObj
            ) {

                updateTargetsFromImage(
                    currentImgObj
                );
            }
        }


        /* =====================================================
           TEXT INPUT
        ===================================================== */

        textInput.addEventListener(
            "input",
            function(event) {

                updateTargetsFromText(
                    event.target.value
                );
            }
        );


        /* =====================================================
           COLOR
        ===================================================== */

        colorInput.addEventListener(
            "input",
            function(event) {

                customColor =
                    event.target.value;


                if (
                    currentMode ===
                    "text"
                ) {

                    updateTargetsFromText(
                        currentText
                    );
                }
            }
        );


      

        imageInput.addEventListener(
            "change",
            function(event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function(event) {

                        const img =
                            new Image();


                        img.onload =
                            function() {

                                textInput.value =
                                    "";


                                updateTargetsFromImage(
                                    img
                                );
                            };


                        img.src =
                            event.target.result;
                    };


                reader.readAsDataURL(
                    file
                );
            }
        );




        audioInput.addEventListener(
            "change",
            function(event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                const audioURL =
                    URL.createObjectURL(
                        file
                    );


                audioPlayer.src =
                    audioURL;


                audioPlayer.play()
                    .then(() => {

                        showStatus(
                            "🎵 Song playing"
                        );

                    })
                    .catch(() => {

                        showStatus(
                            "Click the page to start audio"
                        );
                    });
            }
        );



        const voiceSymbols = {

            "heart": "❤️",
            "love": "❤️",
            "love heart": "❤️",

            "broken heart": "💔",

            "kiss": "💋",

            "smile": "😊",
            "happy": "😊",

            "laugh": "😂",
            "laughing": "😂",

            "cry": "😭",
            "crying": "😭",

            "sad": "😢",

            "angry": "😡",

            "fire": "🔥",

            "star": "⭐",
            "stars": "✨",

            "cat": "🐱",

            "dog": "🐶",

            "rose": "🌹",

            "flower": "🌸",

            "sun": "☀️",

            "moon": "🌙",

            "earth": "🌍",
            "world": "🌍",

            "check": "✅",
            "tick": "✅",

            "cross": "❌",

            "thumbs up": "👍",
            "like": "👍",

            "clap": "👏",

            "cool": "😎",

            "rocket": "🚀",

            "crown": "👑",

            "king": "👑",

            "queen": "👑",

            "party": "🎉",

            "music": "🎵",

            "microphone": "🎤",
            "mic": "🎤"
               
            

        };


        function normalizeVoiceText(
            text
        ) {

            return text
                .toLowerCase()
                .trim()
                .replace(
                    /[.!?,]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                );
        }


        function convertVoiceToDisplayText(
            text
        ) {

            const normalized =
                normalizeVoiceText(
                    text
                );


            /*
                Exact match first.
            */

            if (
                voiceSymbols[
                    normalized
                ]
            ) {

                return voiceSymbols[
                    normalized
                ];
            }


            /*
                Phrase match.
            */

            const keys =
                Object.keys(
                    voiceSymbols
                ).sort(
                    (a, b) =>
                        b.length -
                        a.length
                );


            for (
                const key of keys
            ) {

                if (
                    normalized.includes(
                        key
                    )
                ) {

                    return voiceSymbols[
                        key
                    ];
                }
            }


            /*
                Normal spoken name.
            */

            return text.trim();
        }


        /* =====================================================
           SPEECH RECOGNITION
        ===================================================== */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        let recognition =
            null;


        let isListening =
            false;


        if (
            SpeechRecognition
        ) {

            recognition =
                new SpeechRecognition();


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            recognition.maxAlternatives =
                1;


            recognition.lang =
                "en-US";


            recognition.onstart =
                function() {

                    isListening =
                        true;


                    micButton.classList.add(
                        "listening"
                    );


                    micButton.textContent =
                        "🔴";


                    showStatus(
                        "🎤 Listening..."
                    );
                };


            recognition.onresult =
                function(event) {

                    const spoken =
                        event
                            .results[0][0]
                            .transcript
                            .trim();


                    if (!spoken) {
                        return;
                    }


                    /*
                        Convert speech
                        to text/emoji.
                    */

                    const display =
                        convertVoiceToDisplayText(
                            spoken
                        );


                    /*
                        Put result
                        in search bar.
                    */

                    textInput.value =
                        display;


                    /*
                        Create pixels.
                    */

                    updateTargetsFromText(
                        display
                    );


                    showStatus(
                        `✨ ${spoken}`
                    );


                    /*
                        Speak original
                        spoken words.
                    */

                    speakRepeatedly(
                        spoken
                    );
                };


            recognition.onerror =
                function(event) {

                    isListening =
                        false;


                    micButton.classList.remove(
                        "listening"
                    );


                    micButton.textContent =
                        "🎤";


                    if (
                        event.error ===
                        "not-allowed"
                    ) {

                        showStatus(
                            "🎤 Microphone permission denied"
                        );
                    }

                    else if (
                        event.error ===
                        "no-speech"
                    ) {

                        showStatus(
                            "🎤 No speech detected"
                        );
                    }

                    else {

                        showStatus(
                            "🎤 Microphone error"
                        );
                    }
                };


            recognition.onend =
                function() {

                    isListening =
                        false;


                    micButton.classList.remove(
                        "listening"
                    );


                    micButton.textContent =
                        "🎤";
                };
        }


        else {

            micButton.disabled =
                true;


            micButton.style.opacity =
                "0.4";


            micButton.title =
                "Speech recognition not supported";

            showStatus(
                "⚠️ Voice recognition is not supported"
            );
        }


     

        micButton.addEventListener(
            "click",
            function() {

                if (
                    !recognition
                ) {

                    showStatus(
                        "⚠️ Browser does not support voice recognition"
                    );

                    return;
                }


                if (
                    isListening
                ) {

                    recognition.stop();

                    return;
                }


                /*
                    Stop existing speech.
                */

                window.speechSynthesis.cancel();


                try {

                    recognition.start();

                }

                catch (error) {

                    showStatus(
                        "🎤 Microphone is already active"
                    );
                }
            }
        );


       

        function speakRepeatedly(
            text
        ) {

            if (
                !(
                    "speechSynthesis"
                    in window
                )
            ) {

                showStatus(
                    "⚠️ Text-to-speech unavailable"
                );

                return;
            }


            /*
                Stop previous voice.
            */

            window.speechSynthesis.cancel();


            const repeatCount =
                Number(
                    repeatSelect.value
                );


            let count = 0;


            function speakNext() {

                if (
                    count >=
                    repeatCount
                ) {

                    return;
                }


                count++;


                const utterance =
                    new SpeechSynthesisUtterance(
                        text
                    );


                utterance.lang =
                    "en-US";


                utterance.rate =
                    0.9;


                utterance.pitch =
                    1;


                utterance.onend =
                    function() {

                        setTimeout(
                            speakNext,
                            120
                        );
                    };


                window.speechSynthesis.speak(
                    utterance
                );
            }


            speakNext();
        }



        stopSpeech.addEventListener(
            "click",
            function() {

                window.speechSynthesis.cancel();

                showStatus(
                    "⏹️ Speech stopped"
                );
            }
        );



        window.addEventListener(
            "mousemove",
            function(event) {

                mouse.x =
                    event.clientX;

                mouse.y =
                    event.clientY;
            }
        );



        window.addEventListener(
            "touchmove",
            function(event) {

                if (
                    event.touches.length
                    > 0
                ) {

                    mouse.x =
                        event.touches[0]
                            .clientX;

                    mouse.y =
                        event.touches[0]
                            .clientY;
                }

            },
            {
                passive: true
            }
        );


        window.addEventListener(
            "mouseleave",
            function() {

                mouse.x =
                    -1000;

                mouse.y =
                    -1000;
            }
        );


        window.addEventListener(
            "touchend",
            function() {

                mouse.x =
                    -1000;

                mouse.y =
                    -1000;
            }
        );



        function animate() {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            for (
                let i = 0;
                i < particles.length;
                i++
            ) {

                particles[i].update();

                particles[i].draw();
            }


            requestAnimationFrame(
                animate
            );
        }



        initCanvas();

        animate();

    </script>

</body>
</html>
